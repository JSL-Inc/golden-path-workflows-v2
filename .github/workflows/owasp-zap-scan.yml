name: OWASP ZAP Scan

on:
  workflow_call:
    inputs:
      target_url:
        description: Deployed non-production URL
        required: true
        type: string
      blocking:
        description: Fail on ZAP findings
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  zap:
    name: DAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan non-production target
        continue-on-error: ${{ inputs.blocking == false }}
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: ${{ inputs.target_url }}
          rules_file_name: .zap/rules.tsv
