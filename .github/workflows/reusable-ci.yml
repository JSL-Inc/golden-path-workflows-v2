name: Reusable Standard CI v2

on:
  workflow_call:
    inputs:
      prepare_command:
        description: Dependency restore or environment preparation command
        required: true
        type: string
      unit_test_command:
        description: Unit-test command that emits JUnit XML and Cobertura XML
        required: true
        type: string
      build_command:
        description: Build or package command
        required: true
        type: string
      lint_command:
        description: Formatting, linting, or static-quality command
        required: true
        type: string
      junit_report_path:
        required: false
        type: string
        default: reports/junit/results.xml
      cobertura_report_path:
        required: false
        type: string
        default: reports/coverage/cobertura.xml
      coverage_threshold:
        required: false
        type: number
        default: 80
      enforce_coverage:
        description: False only for an approved transition exception
        required: false
        type: boolean
        default: true
      exception_reference:
        description: RSAM or approved exception reference when enforcement is disabled
        required: false
        type: string
        default: ""
      artifact_name:
        required: false
        type: string
        default: application-package
      artifact_path:
        required: false
        type: string
        default: dist/**

permissions:
  contents: read
  pull-requests: write

jobs:
  standard-ci:
    name: Golden Path CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout application
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Restore dependencies
        id: prepare
        shell: bash
        run: ${{ inputs.prepare_command }}

      - name: Run unit tests
        id: tests
        shell: bash
        timeout-minutes: 10
        run: ${{ inputs.unit_test_command }}

      - name: Validate JUnit XML
        shell: bash
        env:
          REPORT: ${{ inputs.junit_report_path }}
        run: |
          test -s "$REPORT" || {
            echo "::error::Required JUnit XML report is missing or empty: $REPORT"
            exit 1
          }

      - name: Evaluate Cobertura line coverage
        id: coverage
        shell: bash
        env:
          REPORT: ${{ inputs.cobertura_report_path }}
          THRESHOLD: ${{ inputs.coverage_threshold }}
          ENFORCE: ${{ inputs.enforce_coverage }}
          EXCEPTION_REFERENCE: ${{ inputs.exception_reference }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report = os.environ["REPORT"]
          threshold = float(os.environ["THRESHOLD"])
          enforce = os.environ["ENFORCE"].lower() == "true"
          exception = os.environ["EXCEPTION_REFERENCE"].strip()

          if not os.path.isfile(report):
              raise SystemExit(f"Required Cobertura XML report is missing: {report}")

          root = ET.parse(report).getroot()
          line_rate = root.attrib.get("line-rate")
          if line_rate is None:
              raise SystemExit("Cobertura XML root is missing the line-rate attribute")

          percent = float(line_rate) * 100
          status = "pass" if percent >= threshold else "warning"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"percent={percent:.2f}\n")
              output.write(f"status={status}\n")

          if not enforce and not exception:
              raise SystemExit(
                  "Coverage enforcement may be disabled only with an exception_reference"
              )
          if percent < threshold and enforce:
              raise SystemExit(
                  f"Line coverage {percent:.2f}% is below the required {threshold:.2f}%"
              )
          if percent < threshold:
              print(
                  f"::warning::Coverage {percent:.2f}% is below {threshold:.2f}% "
                  f"under transition exception {exception}"
              )
          PY

      - name: Build and package
        id: build
        shell: bash
        run: ${{ inputs.build_command }}

      - name: Run code-quality checks
        id: quality
        shell: bash
        run: ${{ inputs.lint_command }}

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-evidence-${{ github.run_id }}
          path: |
            ${{ inputs.junit_report_path }}
            ${{ inputs.cobertura_report_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Write CI summary
        if: always()
        shell: bash
        env:
          COVERAGE: ${{ steps.coverage.outputs.percent }}
          ENFORCED: ${{ inputs.enforce_coverage }}
          EXCEPTION: ${{ inputs.exception_reference }}
        run: |
          {
            echo "## Golden Path CI v2"
            echo
            echo "| Control | Result |"
            echo "|---|---|"
            echo "| Unit tests | ${{ steps.tests.outcome }} |"
            echo "| JUnit XML | Required |"
            echo "| Line coverage | ${COVERAGE:-N/A}% |"
            echo "| Coverage enforcement | ${ENFORCED} |"
            echo "| Build | ${{ steps.build.outcome }} |"
            echo "| Code quality | ${{ steps.quality.outcome }} |"
            if [[ "$ENFORCED" != "true" ]]; then
              echo
              echo "Transition exception: ${EXCEPTION}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
