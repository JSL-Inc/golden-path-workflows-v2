name: Reusable Deployment v2

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      environment_url:
        required: false
        type: string
        default: ""
      artifact_name:
        required: true
        type: string
      artifact_run_id:
        description: String-form workflow run ID that produced the immutable artifact
        required: true
        type: string
      deploy_command:
        required: true
        type: string
      smoke_test_command:
        required: true
        type: string
    secrets:
      deployment_token:
        required: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ inputs.environment_url }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download previously built artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: promoted-artifact
      - name: Deploy immutable artifact
        shell: bash
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.deployment_token }}
          ARTIFACT_DIRECTORY: promoted-artifact
        run: ${{ inputs.deploy_command }}
      - name: Smoke test deployment
        shell: bash
        run: ${{ inputs.smoke_test_command }}
      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## Deployment"
            echo "- Environment: ${{ inputs.environment_name }}"
            echo "- Artifact: ${{ inputs.artifact_name }}"
            echo "- Source run: ${{ inputs.artifact_run_id }}"
            echo "- Result: passed"
          } >> "$GITHUB_STEP_SUMMARY"
