name: Reusable Production Verification v2

on:
  workflow_call:
    inputs:
      verification_command:
        required: true
        type: string
      release_version:
        required: true
        type: string
      source_sha:
        description: Commit SHA that was deployed to production
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    name: Production Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Run post-deployment checks
        shell: bash
        run: ${{ inputs.verification_command }}
      - name: Create verification evidence
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          mkdir -p reports/production
          python - <<'PY'
          import json
          import os

          evidence = {
              "release_version": os.environ["RELEASE_VERSION"],
              "commit_sha": os.environ["SOURCE_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "status": "passed",
          }
          with open(
              "reports/production/verification.json", "w", encoding="utf-8"
          ) as output:
              json.dump(evidence, output, indent=2)
              output.write("\n")
          PY
      - name: Upload production verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-verification
          path: reports/production/verification.json
          if-no-files-found: error
          retention-days: 90
      - name: Record verification
        shell: bash
        run: |
          echo "Production verification passed for ${{ inputs.release_version }}" \
            >> "$GITHUB_STEP_SUMMARY"
