name: Reusable Security Scan v2

on:
  workflow_call:
    inputs:
      languages:
        description: JSON array of CodeQL languages
        required: false
        type: string
        default: '["python"]'

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@c54b30b7df092240050e69945842bc67aee0f0f4 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@c54b30b7df092240050e69945842bc67aee0f0f4 # v4.37.3
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Block newly introduced high or critical vulnerabilities
        uses: actions/dependency-review-action@595b5aeba73380359d98a5e087f648dbb0edce1b # v4.7.3
        with:
          fail-on-severity: high

  secret-protection-policy:
    name: Secret Protection Policy
    runs-on: ubuntu-latest
    steps:
      - name: Record platform control
        shell: bash
        run: |
          echo "Secret scanning and push protection are repository settings."
          echo "This job records the required policy but does not replace those settings."
          echo "## Secret protection" >> "$GITHUB_STEP_SUMMARY"
          echo "Required repository settings: secret scanning and push protection." >> "$GITHUB_STEP_SUMMARY"
