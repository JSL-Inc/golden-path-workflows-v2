name: Reusable Standard CD

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name used by Standard CI for the deployable artifact
        required: false
        type: string
        default: application-package
      ci_workflow_file:
        description: CI caller workflow filename in the application repository
        required: false
        type: string
        default: golden-path-ci.yml
      cd_workflow_file:
        description: CD caller workflow filename used to validate release promotion
        required: false
        type: string
        default: golden-path-cd.yml
      deploy_command:
        description: Deploy command; environment and artifact directory are appended
        required: false
        type: string
        default: bash scripts/deploy.sh
      integration_test_command:
        description: Integration-test command; environment is appended
        required: false
        type: string
        default: bash scripts/integration-test.sh
      regression_test_command:
        description: Regression-test command; environment is appended
        required: false
        type: string
        default: bash scripts/regression-test.sh
      smoke_test_command:
        description: Smoke-test command; environment and artifact directory are appended
        required: false
        type: string
        default: bash scripts/smoke-test.sh
      production_verify_command:
        description: Optional post-production verification command
        required: false
        type: string
        default: ""
      zap_rules_path:
        description: Repository-owned ZAP rules file protected by CODEOWNERS
        required: false
        type: string
        default: .zap/rules.tsv

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: standard-cd-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  route:
    name: Determine Delivery Plan
    if: github.event_name != 'push' || github.event.created == false
    runs-on: ubuntu-latest
    outputs:
      branch_type: ${{ steps.route.outputs.branch_type }}
      environment: ${{ steps.route.outputs.environment }}
      deploy: ${{ steps.route.outputs.deploy }}
      integration: ${{ steps.route.outputs.integration }}
      regression: ${{ steps.route.outputs.regression }}
      smoke: ${{ steps.route.outputs.smoke }}
      dast: ${{ steps.route.outputs.dast }}
      use_epreprod: ${{ steps.route.outputs.use_epreprod }}
    steps:
      - name: Map branch to delivery behavior
        id: route
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          branch_type=""
          environment=""
          deploy=false
          integration=false
          regression=false
          smoke=false
          dast=false
          use_epreprod=false

          case "$BRANCH" in
            develop-*)
              branch_type="develop"
              ;;
            feature-eint[1-6]-f[0-9]*)
              branch_type="feature"
              environment="${BRANCH#feature-}"
              environment="${environment%%-*}"
              deploy=true
              integration=true
              regression=true
              ;;
            release-eqa-*|hotfix-eqa-*)
              branch_type="${BRANCH%%-*}"
              environment="eqa"
              deploy=true
              integration=true
              regression=true
              smoke=true
              dast=true
              ;;
            release-epreprod-*|hotfix-epreprod-*)
              branch_type="${BRANCH%%-*}"
              environment="eqa"
              deploy=true
              integration=true
              regression=true
              smoke=true
              dast=true
              use_epreprod=true
              ;;
            main)
              branch_type="main"
              environment="prod"
              deploy=true
              smoke=true
              ;;
            *)
              echo "::error::Unsupported branch name: $BRANCH"
              exit 1
              ;;
          esac

          {
            echo "branch_type=$branch_type"
            echo "environment=$environment"
            echo "deploy=$deploy"
            echo "integration=$integration"
            echo "regression=$regression"
            echo "smoke=$smoke"
            echo "dast=$dast"
            echo "use_epreprod=$use_epreprod"
          } >> "$GITHUB_OUTPUT"

  wait_for_ci:
    name: CI Success Gate
    needs: route
    if: >-
      needs.route.outputs.deploy == 'true' &&
      needs.route.outputs.branch_type != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      run_id: ${{ steps.wait.outputs.run_id }}
    steps:
      - name: Wait for successful push CI on this commit
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: ${{ inputs.ci_workflow_file }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          for attempt in {1..120}; do
            response="$(
              gh api \
                --method GET \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/${CI_WORKFLOW}/runs" \
                -f head_sha="$CURRENT_SHA" \
                -f event="push" \
                -f per_page=20
            )"

            run_id="$(
              jq -r '
                .workflow_runs
                | sort_by(.created_at)
                | reverse
                | .[0].id // empty
              ' <<< "$response"
            )"
            status="$(
              jq -r '
                .workflow_runs
                | sort_by(.created_at)
                | reverse
                | .[0].status // empty
              ' <<< "$response"
            )"
            conclusion="$(
              jq -r '
                .workflow_runs
                | sort_by(.created_at)
                | reverse
                | .[0].conclusion // empty
              ' <<< "$response"
            )"

            if [[ -z "$run_id" ]]; then
              echo "Attempt $attempt: CI run for $CURRENT_SHA is not registered yet."
            elif [[ "$status" != "completed" ]]; then
              echo "Attempt $attempt: CI run $run_id is currently $status."
            elif [[ "$conclusion" == "success" ]]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "CI run $run_id passed for $CURRENT_SHA."
              exit 0
            else
              echo "::error::CI run $run_id completed with conclusion: $conclusion"
              exit 1
            fi

            sleep 15
          done

          echo "::error::Timed out waiting for push CI on $CURRENT_SHA."
          exit 1

  artifact:
    name: Resolve Validated Artifact
    needs: [route, wait_for_ci]
    if: >-
      always() &&
      needs.route.outputs.deploy == 'true' &&
      (needs.route.outputs.branch_type == 'main' ||
       needs.wait_for_ci.result == 'success')
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - name: Resolve artifact source
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_TYPE: ${{ needs.route.outputs.branch_type }}
          CI_RUN_ID: ${{ needs.wait_for_ci.outputs.run_id }}
          CI_WORKFLOW: ${{ inputs.ci_workflow_file }}
          CD_WORKFLOW: ${{ inputs.cd_workflow_file }}
          RELEASE_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$BRANCH_TYPE" != "main" ]]; then
            if [[ -z "$CI_RUN_ID" ]]; then
              echo "::error::No successful CI run was resolved for $RELEASE_SHA."
              exit 1
            fi

            echo "run_id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "Using CI artifact from run $CI_RUN_ID for $RELEASE_SHA."
            exit 0
          fi

          candidate="$(
            gh api "/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls" |
              jq -c \
              --arg base "$TARGET_BRANCH" \
              '[
                .[]
                | select(.merged_at != null and .base.ref == $base)
                | select(
                    (.head.ref | startswith("release-")) or
                    (.head.ref | startswith("hotfix-"))
                  )
              ] | sort_by(.merged_at) | last // empty'
          )"

          if [[ -z "$candidate" || "$candidate" == "null" ]]; then
            echo "::error::No merged release or hotfix pull request was found for $RELEASE_SHA targeting $TARGET_BRANCH."
            exit 1
          fi

          source_branch="$(jq -r '.head.ref' <<< "$candidate")"
          source_sha="$(jq -r '.head.sha' <<< "$candidate")"

          run_id="$(
            gh run list \
              --workflow "$CI_WORKFLOW" \
              --branch "$source_branch" \
              --commit "$source_sha" \
              --event push \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"

          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "::error::No successful release-candidate CI run was found for $source_branch at $source_sha."
            exit 1
          fi

          validated_cd_run_id="$(
            gh run list \
              --workflow "$CD_WORKFLOW" \
              --branch "$source_branch" \
              --commit "$source_sha" \
              --event push \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"

          if [[ -z "$validated_cd_run_id" || "$validated_cd_run_id" == "null" ]]; then
            echo "::error::No successful release-candidate CD run was found for $source_branch at $source_sha."
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Validated release CD run $validated_cd_run_id."
          echo "Promoting CI artifact from $source_branch at $source_sha, run $run_id."

      - name: Download application artifact from source CI
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
          path: source-artifact

      - name: Validate downloaded artifact
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find source-artifact -type f -print -quit)" || {
            echo "::error::No files were downloaded from the source CI run."
            exit 1
          }

      - name: Make artifact available to deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: source-artifact/**
          if-no-files-found: error
          retention-days: 2

  deploy:
    name: Deploy ${{ needs.route.outputs.environment }}
    needs: [route, artifact]
    if: needs.route.outputs.deploy == 'true' && needs.artifact.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.route.outputs.environment }}
    concurrency:
      group: environment-${{ github.repository }}-${{ needs.route.outputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: promoted-artifact

      - name: Deploy application
        shell: bash
        env:
          COMMAND: ${{ inputs.deploy_command }}
          ENVIRONMENT: ${{ needs.route.outputs.environment }}
        run: |
          set -euo pipefail
          $COMMAND "$ENVIRONMENT" promoted-artifact

  integration:
    name: Integration Tests
    needs: [route, deploy]
    if: always() && needs.route.outputs.integration == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run integration tests
        shell: bash
        env:
          COMMAND: ${{ inputs.integration_test_command }}
          ENVIRONMENT: ${{ needs.route.outputs.environment }}
        run: $COMMAND "$ENVIRONMENT"
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: reports/integration/**
          if-no-files-found: error

  regression:
    name: Regression Tests
    needs: [route, deploy]
    if: always() && needs.route.outputs.regression == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run regression tests
        shell: bash
        env:
          COMMAND: ${{ inputs.regression_test_command }}
          ENVIRONMENT: ${{ needs.route.outputs.environment }}
        run: $COMMAND "$ENVIRONMENT"
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-evidence
          path: reports/regression/**
          if-no-files-found: error

  smoke:
    name: Smoke Tests
    needs: [route, deploy]
    if: always() && needs.route.outputs.smoke == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: promoted-artifact
      - name: Run smoke tests
        shell: bash
        env:
          COMMAND: ${{ inputs.smoke_test_command }}
          ENVIRONMENT: ${{ needs.route.outputs.environment }}
        run: $COMMAND "$ENVIRONMENT" promoted-artifact

  dast:
    name: DAST Policy Validation
    needs: [route, deploy]
    if: always() && needs.route.outputs.dast == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository ZAP policy
        shell: bash
        env:
          RULES_FILE: ${{ inputs.zap_rules_path }}
          ENVIRONMENT: ${{ needs.route.outputs.environment }}
        run: |
          test -s "$RULES_FILE" || {
            echo "::error::ZAP rules file is missing or empty: $RULES_FILE"
            exit 1
          }
          awk -F '\t' 'NF != 3 { exit 1 }' "$RULES_FILE"
          echo "DAST policy validation passed for $ENVIRONMENT."

  int_gate:
    name: INT Gate
    needs: [route, deploy, integration, regression]
    if: always() && needs.route.outputs.branch_type == 'feature'
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate INT gate
        shell: bash
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          REGRESSION_RESULT: ${{ needs.regression.result }}
        run: |
          if [[ "$DEPLOY_RESULT" != "success" ||
                "$INTEGRATION_RESULT" != "success" ||
                "$REGRESSION_RESULT" != "success" ]]; then
            echo "::error::INT deployment or testing failed."
            exit 1
          fi
          echo "INT Gate passed."

  qa_gate:
    name: QA Gate
    needs: [route, deploy, integration, regression, smoke, dast]
    if: >-
      always() &&
      (needs.route.outputs.branch_type == 'release' ||
       needs.route.outputs.branch_type == 'hotfix')
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate QA gate
        shell: bash
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          REGRESSION_RESULT: ${{ needs.regression.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          DAST_RESULT: ${{ needs.dast.result }}
        run: |
          if [[ "$DEPLOY_RESULT" != "success" ||
                "$INTEGRATION_RESULT" != "success" ||
                "$REGRESSION_RESULT" != "success" ||
                "$SMOKE_RESULT" != "success" ||
                "$DAST_RESULT" != "success" ]]; then
            echo "::error::EQA deployment or testing failed."
            exit 1
          fi
          echo "QA Gate passed."

  deploy_epreprod:
    name: Deploy ePreProd
    needs: [route, artifact, qa_gate]
    if: always() && needs.route.outputs.use_epreprod == 'true' && needs.qa_gate.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: epreprod
    concurrency:
      group: environment-${{ github.repository }}-epreprod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: promoted-artifact
      - name: Deploy application
        shell: bash
        env:
          COMMAND: ${{ inputs.deploy_command }}
        run: $COMMAND epreprod promoted-artifact

  preprod_integration:
    name: ePreProd Integration Tests
    needs: [route, deploy_epreprod]
    if: always() && needs.route.outputs.use_epreprod == 'true' && needs.deploy_epreprod.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run integration tests
        shell: bash
        env:
          COMMAND: ${{ inputs.integration_test_command }}
        run: $COMMAND epreprod
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epreprod-integration-evidence
          path: reports/integration/**
          if-no-files-found: error

  preprod_regression:
    name: ePreProd Regression Tests
    needs: [route, deploy_epreprod]
    if: always() && needs.route.outputs.use_epreprod == 'true' && needs.deploy_epreprod.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run regression tests
        shell: bash
        env:
          COMMAND: ${{ inputs.regression_test_command }}
        run: $COMMAND epreprod
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epreprod-regression-evidence
          path: reports/regression/**
          if-no-files-found: error

  preprod_smoke:
    name: ePreProd Smoke Tests
    needs: [route, deploy_epreprod]
    if: always() && needs.route.outputs.use_epreprod == 'true' && needs.deploy_epreprod.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: promoted-artifact
      - name: Run smoke tests
        shell: bash
        env:
          COMMAND: ${{ inputs.smoke_test_command }}
        run: $COMMAND epreprod promoted-artifact

  preprod_dast:
    name: ePreProd DAST Policy Validation
    needs: [route, deploy_epreprod]
    if: always() && needs.route.outputs.use_epreprod == 'true' && needs.deploy_epreprod.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository ZAP policy
        shell: bash
        env:
          RULES_FILE: ${{ inputs.zap_rules_path }}
        run: |
          test -s "$RULES_FILE" || {
            echo "::error::ZAP rules file is missing or empty: $RULES_FILE"
            exit 1
          }
          awk -F '\t' 'NF != 3 { exit 1 }' "$RULES_FILE"
          echo "DAST policy validation passed for epreprod."

  preprod_gate:
    name: ePreProd Gate
    needs:
      - route
      - deploy_epreprod
      - preprod_integration
      - preprod_regression
      - preprod_smoke
      - preprod_dast
    if: always() && needs.route.outputs.use_epreprod == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate ePreProd gate
        shell: bash
        env:
          DEPLOY_RESULT: ${{ needs.deploy_epreprod.result }}
          INTEGRATION_RESULT: ${{ needs.preprod_integration.result }}
          REGRESSION_RESULT: ${{ needs.preprod_regression.result }}
          SMOKE_RESULT: ${{ needs.preprod_smoke.result }}
          DAST_RESULT: ${{ needs.preprod_dast.result }}
        run: |
          if [[ "$DEPLOY_RESULT" != "success" ||
                "$INTEGRATION_RESULT" != "success" ||
                "$REGRESSION_RESULT" != "success" ||
                "$SMOKE_RESULT" != "success" ||
                "$DAST_RESULT" != "success" ]]; then
            echo "::error::ePreProd deployment or testing failed."
            exit 1
          fi
          echo "ePreProd Gate passed."

  production_verification:
    name: Production Verification
    needs: [route, deploy, smoke]
    if: always() && needs.route.outputs.branch_type == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production delivery
        shell: bash
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          VERIFY_COMMAND: ${{ inputs.production_verify_command }}
        run: |
          if [[ "$DEPLOY_RESULT" != "success" || "$SMOKE_RESULT" != "success" ]]; then
            echo "::error::Production deployment or smoke testing failed."
            exit 1
          fi

          if [[ -n "$VERIFY_COMMAND" ]]; then
            $VERIFY_COMMAND
          fi

          echo "Production Verification passed."

  release_readiness:
    name: Release Readiness
    needs: [route, qa_gate, preprod_gate]
    if: >-
      always() &&
      (needs.route.outputs.branch_type == 'release' ||
       needs.route.outputs.branch_type == 'hotfix')
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate release readiness
        shell: bash
        env:
          USE_EPREPROD: ${{ needs.route.outputs.use_epreprod }}
          QA_GATE_RESULT: ${{ needs.qa_gate.result }}
          PREPROD_GATE_RESULT: ${{ needs.preprod_gate.result }}
        run: |
          if [[ "$QA_GATE_RESULT" != "success" ]]; then
            echo "::error::The EQA deployment and QA Gate must pass."
            exit 1
          fi

          if [[ "$USE_EPREPROD" == "true" && "$PREPROD_GATE_RESULT" != "success" ]]; then
            echo "::error::This release requires a successful ePreProd Gate."
            exit 1
          fi

          if [[ "$USE_EPREPROD" == "true" ]]; then
            echo "Release Readiness passed: EQA and ePreProd are complete."
          else
            echo "Release Readiness passed: EQA is complete; ePreProd is not used."
          fi

  production_release:
    name: Production Release
    needs: [route, production_verification]
    if: >-
      always() &&
      needs.route.outputs.branch_type == 'main' &&
      needs.production_verification.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: production-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Calculate release version
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          pull_requests="$(
            gh api "/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls"
          )"

          pr="$(
            jq -c \
              --arg base "$TARGET_BRANCH" \
              '[
                .[]
                | select(
                    .merged_at != null
                    and .base.ref == $base
                    and (
                      (.head.ref | startswith("release-"))
                      or
                      (.head.ref | startswith("hotfix-"))
                    )
                  )
              ]
              | sort_by(.merged_at)
              | last // empty
              ' <<< "$pull_requests"
          )"

          if [[ -z "$pr" || "$pr" == "null" ]]; then
            echo "::error::No merged release or hotfix PR was found for ${RELEASE_SHA} targeting ${TARGET_BRANCH}."
            exit 1
          fi

          pr_number="$(jq -r '.number' <<< "$pr")"
          pr_title="$(jq -r '.title' <<< "$pr")"
          pr_url="$(jq -r '.html_url' <<< "$pr")"
          source_branch="$(jq -r '.head.ref' <<< "$pr")"
          labels="$(jq -r '[.labels[].name] | join(" ")' <<< "$pr")"

          count=0
          bump=""

          for label in major minor patch; do
            if [[ " $labels " == *" $label "* ]]; then
              count=$((count + 1))
              bump="$label"
            fi
          done

          if [[ "$count" -ne 1 ]]; then
            echo "::error::PR #${pr_number} must have exactly one of: major, minor, patch."
            exit 1
          fi

          existing="$(
            git tag --points-at "$RELEASE_SHA" \
              --list 'v[0-9]*.[0-9]*.[0-9]*' |
              head -n 1
          )"

          if [[ -n "$existing" ]]; then
            version="$existing"
          else
            latest="$(
              git tag \
                --list 'v[0-9]*.[0-9]*.[0-9]*' \
                --sort=-v:refname |
                head -n 1
            )"

            latest="${latest:-v0.0.0}"
            IFS=. read -r major minor patch <<< "${latest#v}"

            case "$bump" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
            esac

            version="v${major}.${minor}.${patch}"
          fi

          {
            echo "version=$version"
            echo "bump=$bump"
            echo "pr_number=$pr_number"
            echo "pr_title=$pr_title"
            echo "pr_url=$pr_url"
            echo "source_branch=$source_branch"
          } >> "$GITHUB_OUTPUT"

      - name: Download promoted build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: release-artifact

      - name: Package release artifact
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          tar -czf "application-package-${VERSION}.tgz" \
            -C release-artifact .

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          BUMP: ${{ steps.release.outputs.bump }}
          PR_NUMBER: ${{ steps.release.outputs.pr_number }}
          PR_TITLE: ${{ steps.release.outputs.pr_title }}
          PR_URL: ${{ steps.release.outputs.pr_url }}
          SOURCE_BRANCH: ${{ steps.release.outputs.source_branch }}
          RELEASE_SHA: ${{ github.sha }}
          DELIVERY_RUN_ID: ${{ github.run_id }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "$VERSION already exists; nothing to recreate."
            exit 0
          fi

          delivery_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${DELIVERY_RUN_ID}"

          notes="$(
            printf '%s\n' \
              '## Release information' \
              '' \
              "- **Version:** ${VERSION}" \
              "- **Classification:** ${BUMP}" \
              "- **Source branch:** \`${SOURCE_BRANCH}\`" \
              "- **Release PR:** [#${PR_NUMBER} — ${PR_TITLE}](${PR_URL})" \
              "- **Delivery pipeline:** [Run ${DELIVERY_RUN_ID}](${delivery_url})" \
              '- **Production deployment:** passed' \
              '- **Production verification:** passed' \
              '' \
              '## Release assets' \
              '' \
              "- \`application-package-${VERSION}.tgz\`" \
              ''
          )"

          gh release create "$VERSION" \
            "application-package-${VERSION}.tgz#Release Build Artifact" \
            --target "$RELEASE_SHA" \
            --title "$VERSION" \
            --notes "$notes" \
            --generate-notes

      - name: Summary
        run: |
          {
            echo "## Production Release ${{ steps.release.outputs.version }}"
            echo "- Classification: ${{ steps.release.outputs.bump }}"
            echo "- Source branch: ${{ steps.release.outputs.source_branch }}"
            echo "- Release PR: #${{ steps.release.outputs.pr_number }}"
            echo "- Delivery pipeline: ${{ github.run_id }}"
            echo "- Release artifact attached"
            echo "- GitHub release and tag created"
          } >> "$GITHUB_STEP_SUMMARY"
