name: Reusable Standard CI

on:
  workflow_call:
    inputs:
      prepare_command:
        description: Optional dependency restore or environment setup command
        required: false
        type: string
        default: ""
      build_command:
        description: Command that validates or builds the application source
        required: true
        type: string
      unit_test_command:
        description: Command that runs unit tests and creates JUnit and Cobertura reports
        required: true
        type: string
      lint_command:
        description: Optional linting, formatting, or static-quality command
        required: false
        type: string
        default: ""
      junit_report_path:
        description: Path to the generated JUnit XML report
        required: false
        type: string
        default: reports/junit/results.xml
      cobertura_report_path:
        description: Path to the generated Cobertura XML report
        required: false
        type: string
        default: reports/coverage/cobertura.xml
      coverage_language:
        description: Primary language represented by the coverage report
        required: true
        type: string
      artifact_type:
        description: Deployable artifact type; package preserves legacy behavior and container publishes an immutable image descriptor
        required: false
        type: string
        default: package
      publish_artifact:
        description: Publish the deployable package or container descriptor; containers are additionally restricted to push events
        required: false
        type: boolean
        default: true
      artifact_name:
        description: Name of the deployable artifact or deployment descriptor
        required: false
        type: string
        default: application-package
      artifact_path:
        description: Package output path used when artifact_type is package
        required: false
        type: string
        default: dist/**
      registry_provider:
        description: Container registry provider; acr uses Azure OIDC and custom uses the custom registry settings
        required: false
        type: string
        default: acr
      acr_name:
        description: Azure Container Registry name without the azurecr.io suffix
        required: false
        type: string
        default: ""
      registry_server:
        description: Custom OCI registry hostname
        required: false
        type: string
        default: ""
      image_repository:
        description: Repository path for the container image
        required: false
        type: string
        default: ""
      dockerfile:
        description: Dockerfile used to build the deployable image
        required: false
        type: string
        default: Dockerfile
      build_context:
        description: Docker build context
        required: false
        type: string
        default: .
      custom_registry_login_command:
        description: Login command for a custom OCI registry; credentials must come from inherited secrets
        required: false
        type: string
        default: ""
      retention_days:
        description: Retention period for POC evidence and artifacts
        required: false
        type: number
        default: 14

permissions:
  contents: read
  id-token: write
  code-quality: write

jobs:
  standard-ci:
    name: Standard CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Prepare build environment
        if: inputs.prepare_command != ''
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.prepare_command }}

      - name: Build application
        id: build
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.build_command }}

      - name: Run unit tests and coverage
        id: tests
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          ${{ inputs.unit_test_command }}

      - name: Validate test reports
        id: reports
        shell: bash
        env:
          JUNIT_REPORT: ${{ inputs.junit_report_path }}
          COBERTURA_REPORT: ${{ inputs.cobertura_report_path }}
        run: |
          test -s "$JUNIT_REPORT" || {
            echo "::error::Required JUnit XML report is missing or empty: $JUNIT_REPORT"
            exit 1
          }
          test -s "$COBERTURA_REPORT" || {
            echo "::error::Required Cobertura XML report is missing or empty: $COBERTURA_REPORT"
            exit 1
          }

      - name: Publish coverage to GitHub
        id: coverage
        continue-on-error: true
        uses: actions/upload-code-coverage@v1
        with:
          file: ${{ inputs.cobertura_report_path }}
          language: ${{ inputs.coverage_language }}
          label: standard-ci
          fail-on-error: false
          token: ${{ github.token }}

      - name: Run code-quality checks
        id: quality
        if: inputs.lint_command != ''
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.lint_command }}

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            ${{ inputs.junit_report_path }}
            ${{ inputs.cobertura_report_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Resolve container destination
        id: container
        if: inputs.artifact_type == 'container'
        shell: bash
        env:
          PROVIDER: ${{ inputs.registry_provider }}
          ACR_NAME: ${{ inputs.acr_name }}
          CUSTOM_SERVER: ${{ inputs.registry_server }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_REPOSITORY" || {
            echo "::error::image_repository is required for container delivery."
            exit 1
          }

          case "$PROVIDER" in
            acr)
              test -n "$ACR_NAME" || {
                echo "::error::acr_name is required when registry_provider is acr."
                exit 1
              }
              registry_server="${ACR_NAME}.azurecr.io"
              ;;
            custom)
              test -n "$CUSTOM_SERVER" || {
                echo "::error::registry_server is required when registry_provider is custom."
                exit 1
              }
              registry_server="${CUSTOM_SERVER%/}"
              ;;
            *)
              echo "::error::Unsupported registry_provider: $PROVIDER"
              exit 1
              ;;
          esac

          echo "registry_server=$registry_server" >> "$GITHUB_OUTPUT"
          echo "image_tag=${registry_server}/${IMAGE_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure with OIDC
        if: inputs.artifact_type == 'container' && inputs.registry_provider == 'acr' && inputs.publish_artifact && github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        if: inputs.artifact_type == 'container' && inputs.registry_provider == 'acr' && inputs.publish_artifact && github.event_name == 'push'
        shell: bash
        env:
          ACR_NAME: ${{ inputs.acr_name }}
        run: az acr login --name "$ACR_NAME"

      - name: Log in to custom container registry
        if: inputs.artifact_type == 'container' && inputs.registry_provider == 'custom' && inputs.publish_artifact && github.event_name == 'push'
        shell: bash
        env:
          COMMAND: ${{ inputs.custom_registry_login_command }}
          REGISTRY_SERVER: ${{ steps.container.outputs.registry_server }}
        run: |
          set -euo pipefail
          test -n "$COMMAND" || {
            echo "::error::custom_registry_login_command is required for custom registry publication."
            exit 1
          }
          $COMMAND

      - name: Set up Docker Buildx
        if: inputs.artifact_type == 'container'
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        id: container_build
        if: inputs.artifact_type == 'container'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ github.event_name == 'push' && inputs.publish_artifact }}
          tags: ${{ steps.container.outputs.image_tag }}
          provenance: true
          sbom: true

      - name: Create immutable deployment descriptor
        if: inputs.artifact_type == 'container' && inputs.publish_artifact && github.event_name == 'push'
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.container.outputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.container_build.outputs.digest }}
          REGISTRY_PROVIDER: ${{ inputs.registry_provider }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Container build did not return a valid immutable digest."
            exit 1
          }

          image_repository="${IMAGE_TAG%:*}"
          image_reference="${image_repository}@${IMAGE_DIGEST}"
          mkdir -p dist/deployment
          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg registry_provider "$REGISTRY_PROVIDER" \
            --arg image_tag "$IMAGE_TAG" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg image_reference "$image_reference" \
            '{
              schemaVersion: 1,
              artifactType: "container",
              sourceSha: $source_sha,
              registryProvider: $registry_provider,
              imageTag: $image_tag,
              imageDigest: $image_digest,
              imageReference: $image_reference
            }' > dist/deployment/deployment-metadata.json

          echo "Published immutable image: $image_reference"

      - name: Publish package artifact
        id: package_artifact
        if: inputs.artifact_type == 'package' && inputs.publish_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Publish container deployment descriptor
        id: container_artifact
        if: inputs.artifact_type == 'container' && inputs.publish_artifact && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/deployment/deployment-metadata.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Write CI summary
        if: always()
        shell: bash
        env:
          LINT_CONFIGURED: ${{ inputs.lint_command != '' }}
          ARTIFACT_TYPE: ${{ inputs.artifact_type }}
          PUBLISH_ARTIFACT: ${{ inputs.publish_artifact }}
          PACKAGE_OUTCOME: ${{ steps.package_artifact.outcome }}
          CONTAINER_OUTCOME: ${{ steps.container_artifact.outcome }}
        run: |
          result() {
            case "$1" in
              success) echo "Passed" ;;
              failure) echo "Failed" ;;
              skipped|'') echo "Not run" ;;
              *) echo "$1" ;;
            esac
          }

          artifact_outcome="$PACKAGE_OUTCOME"
          if [[ "$ARTIFACT_TYPE" == "container" ]]; then
            artifact_outcome="$CONTAINER_OUTCOME"
          fi

          {
            echo "## Standard CI"
            echo
            echo "| Control | Result |"
            echo "|---|---|"
            echo "| Build | $(result '${{ steps.build.outcome }}') |"
            echo "| Unit tests | $(result '${{ steps.tests.outcome }}') |"
            echo "| JUnit and Cobertura reports | $(result '${{ steps.reports.outcome }}') |"
            echo "| Coverage upload | $(result '${{ steps.coverage.outcome }}') |"

            if [[ "$LINT_CONFIGURED" == "true" ]]; then
              echo "| Code quality | $(result '${{ steps.quality.outcome }}') |"
            else
              echo "| Code quality | Not configured |"
            fi

            if [[ "$ARTIFACT_TYPE" == "container" ]]; then
              echo "| Container build | $(result '${{ steps.container_build.outcome }}') |"
            fi

            if [[ "$PUBLISH_ARTIFACT" == "true" && "${{ github.event_name }}" == "push" ]]; then
              echo "| Deployable $ARTIFACT_TYPE | $(result "$artifact_outcome") |"
            else
              echo "| Deployable $ARTIFACT_TYPE | Validated only; not published |"
            fi

            echo
            echo "Container images are published only for push events and promoted by immutable digest."
          } >> "$GITHUB_STEP_SUMMARY"
