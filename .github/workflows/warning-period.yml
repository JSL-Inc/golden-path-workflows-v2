name: Golden Path Warning Period

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows:
      - Golden Path CI
      - Golden Path CD
      - Branch Validation
      - PR Flow
      - Code Coverage
      - CodeQL
      - FOSSA
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  warning:
    name: Warning Period Notice
    runs-on: ubuntu-latest
    steps:
      - name: Post warning-period notice
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- golden-path-warning-period -->';
            const body = `${marker}
            ## Golden Path warning period

            The following checks are currently **informational**. They do not block this pull request during the warning period, but they are planned to become required and blocking.

            **Golden Path checks**
            - Standard CI
            - INT Gate
            - ePreProd Gate
            - Branch Name
            - Branch Flow
            - QA Gate

            **Repository ruleset and security checks**
            - Code coverage
            - Code scanning
            - Code quality
            - Secret scanning
            - FOSSA scan *(not currently implemented)*

            Use this warning period to resolve failures and configure missing checks before enforcement begins.`;

            const { owner, repo } = context.repo;
            let pullRequests = [];

            if (context.eventName === 'pull_request') {
              pullRequests = [context.payload.pull_request];
            } else {
              pullRequests = context.payload.workflow_run.pull_requests ?? [];

              if (pullRequests.length === 0) {
                const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner,
                  repo,
                  commit_sha: context.payload.workflow_run.head_sha,
                });
                pullRequests = associated.data;
              }
            }

            const pullRequestNumbers = [
              ...new Set(
                pullRequests
                  .map((pullRequest) => pullRequest.number),
              ),
            ];

            if (pullRequestNumbers.length === 0) {
              core.info('No open pull request is associated with this workflow run.');
              return;
            }

            for (const issue_number of pullRequestNumbers) {
              const { data: pullRequest } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: issue_number,
              });

              if (pullRequest.state !== 'open') {
                core.info(`Skipping closed PR #${issue_number}.`);
                continue;
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const existing = comments.find((comment) => comment.body?.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
                core.info(`Updated warning-period notice on PR #${issue_number}.`);
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                });
                core.info(`Posted warning-period notice on PR #${issue_number}.`);
              }
            }
